<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Cancer Detection</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        :root {
            --primary-color: #2196F3;
            --secondary-color: #1976D2;
            --background: #f5f5f5;
            --card-bg: #ffffff;
            --success-color: #4CAF50;
            --danger-color: #f44336;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--background);
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 4rem 2rem;
            text-align: center;
            margin-bottom: 2rem;
            animation: gradientShift 15s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 300;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease forwards;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease forwards 0.2s;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .upload-container {
            background: var(--card-bg);
            border: 2px dashed #ccc;
            padding: 40px;
            margin: 20px auto;
            border-radius: 15px;
            max-width: 600px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .upload-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        #preview {
            max-width: 300px;
            margin: 20px auto;
            display: none;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        #preview:hover {
            transform: scale(1.05);
        }

        #result {
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            font-size: 18px;
            max-width: 600px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        #result.show {
            opacity: 1;
            transform: translateY(0);
        }

        .malignant {
            background-color: rgba(244, 67, 54, 0.1);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }

        .benign {
            background-color: rgba(76, 175, 80, 0.1);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .loader {
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: #333;
            color: white;
            margin-top: 3rem;
        }

        @media (max-width: 768px) {
            .header {
                padding: 2rem 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .upload-container {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Skin Cancer Detection</h1>
        <p>Upload a skin lesion image to check for potential skin cancer</p>
    </header>
    
    <div class="upload-container">
        <input type="file" id="imageUpload" accept="image/*" style="display: none;">
        <button onclick="document.getElementById('imageUpload').click()">Select Image</button>
        <p>or drag and drop image here</p>
        <img id="preview">
        <div class="loader" id="loader"></div>
    </div>
    
    <div id="result"></div>
    
    <footer>
        <p>&copy; 2025 Medical Image Analysis Platform. For educational purposes only. Not for clinical use.</p>
    </footer>

    <script>
        // Global variables
        let modelSession = null;
        const MODEL_PATH = 'skin_cancer_model.onnx';
        
        // Initialize
        async function initModel() {
            console.log("Using Flask Backend");
        }
        
        // Backend does preprocessing now
        
        // Update the runInference function to show results properly
        async function runInference(file) {
            try {
                document.getElementById('loader').style.display = 'block';
                document.getElementById('result').innerHTML = '';
                
                const formData = new FormData();
                formData.append('image', file);
                
                const response = await fetch('/predict/skin', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error('API error');
                }
                
                const data = await response.json();
                
                // Get results
                const isMalignant = data.is_malignant;
                const confidence = data.confidence;
                const confidenceFormatted = confidence.toFixed(1);
                
                // Display results
                const resultDiv = document.getElementById('result');
                resultDiv.className = isMalignant ? 'malignant show' : 'benign show'; // Added 'show' class
                resultDiv.innerHTML = `
                    <h2>${isMalignant ? '⚠️ Potential Skin Cancer Detected' : '✅ No Skin Cancer Detected'}</h2>
                    <p>Confidence: ${confidenceFormatted}%</p>
                    ${isMalignant ? '<p>Please consult a dermatologist for further evaluation.</p>' : ''}
                `;
                
            } catch (error) {
                console.error("Inference error:", error);
                const resultDiv = document.getElementById('result');
                resultDiv.className = 'show'; // Add show class even for errors
                resultDiv.innerHTML = '<p style="color:red">Error processing image. Please try another image.</p>';
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }
        
        // Handle file selection
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('preview').src = event.target.result;
                document.getElementById('preview').style.display = 'block';
                runInference(file);
            };
            reader.readAsDataURL(file);
        });
        
        // Handle drag and drop
        const uploadContainer = document.querySelector('.upload-container');
        
        uploadContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadContainer.style.borderColor = '#4CAF50';
        });
        
        uploadContainer.addEventListener('dragleave', () => {
            uploadContainer.style.borderColor = '#ccc';
        });
        
        uploadContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadContainer.style.borderColor = '#ccc';
            
            const file = e.dataTransfer.files[0];
            if (!file.type.match('image.*')) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('preview').src = event.target.result;
                document.getElementById('preview').style.display = 'block';
                runInference(file);
            };
            reader.readAsDataURL(file);
        });
        
        // Initialize model when page loads
        window.onload = initModel;
    </script>
</body>
</html>
